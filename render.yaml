services:
  - type: web
    name: pumpfun-new-token-scanner
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ONLY_FUN
        value: "true"
      - key: ENRICH_SECONDS
        value: "2"
      - key: MAX_ITEMS
        value: "200"
